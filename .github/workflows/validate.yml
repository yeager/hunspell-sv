name: Validate Swedish Dictionary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly validation
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install hunspell
        run: sudo apt-get update && sudo apt-get install -y hunspell
      
      - name: Basic dictionary stats
        run: |
          WORD_COUNT=$(head -1 sv_SE.dic)
          echo "📖 Dictionary entries: $WORD_COUNT"
          echo "📝 Affix rules: $(wc -l < sv_SE.aff)"
          echo "word_count=$WORD_COUNT" >> $GITHUB_OUTPUT
      
      - name: Validate both dictionaries and build regressions
        run: python3 -m unittest discover -s tests -v

      - name: Test common Swedish words
        run: |
          FAILS=0
          while IFS= read -r word; do
            result=$(echo "$word" | hunspell -i UTF-8 -d ./sv_SE -p /dev/null -l)
            if [ -n "$result" ]; then
              echo "❌ MISSING: $word"
              FAILS=$((FAILS + 1))
            fi
          done << 'WORDS'
          dator
          översättning
          stavningskontroll
          programvara
          inställningar
          användargränssnitt
          filhanterare
          säkerhetskopia
          operativsystem
          webbläsare
          WORDS
          
          if [ $FAILS -gt 0 ]; then
            echo "❌ $FAILS common words missing!"
            exit 1
          fi
          echo "✅ All common words found"
      
      - name: Test TM compound words
        run: |
          FAILS=0
          while IFS= read -r word; do
            result=$(echo "$word" | hunspell -i UTF-8 -d ./sv_SE -p /dev/null -l)
            if [ -n "$result" ]; then
              echo "⚠️  Not found: $word"
              FAILS=$((FAILS + 1))
            fi
          done << 'WORDS'
          lösenfras
          meddelandekö
          symlänk
          filbläddrare
          åsidosättning
          fjärrvärd
          trädvy
          skogshuggartält
          datakällobjekt
          vertexfärg
          WORDS
          
          echo "TM compound words: $((10 - FAILS))/10 found"
          if [ $FAILS -gt 3 ]; then
            echo "❌ Too many TM words missing"
            exit 1
          fi
          echo "✅ TM words OK"
